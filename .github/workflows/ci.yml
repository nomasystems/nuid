name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REBAR3_VERSION: '3.28.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1.24.1
        id: setup-beam
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - uses: actions/cache@v4
        id: rebar3-cache
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.rebar3-version }}-${{ hashFiles('rebar.config', 'rebar.lock') }}

      - run: rebar3 check

      - run: rebar3 test

      - uses: test-summary/action@v2
        if: always()
        with:
          paths: '_build/test/logs/**/junit_report.xml'

  ci-ok:
    if: always()
    needs: [check]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: test "${{ needs.check.result }}" = success
